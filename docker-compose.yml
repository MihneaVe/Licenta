# ----------------------------------------------------------------------
# CivicPulse — local orchestration (FastAPI backend + React dashboard)
#
# Default `docker compose up` brings up:
#   web      — FastAPI (uvicorn) on http://localhost:8000
#                /api/chat/ (streaming RAG), /api/rag/feedback/, /healthz
#   frontend — React 19 + Vite on http://localhost:5173 (UrbanPulse dashboard)
#
# Both tiers share Supabase as their single source of truth:
#   * FastAPI talks to Supabase Postgres via SQLAlchemy (DB_* in .env) and to
#     Ollama on the host (qwen2.5:14b + nomic-embed-text) for the RAG pipeline.
#   * React reads the `feedbacks` / `quarters_map` SQL views directly from Supabase.
#
# Optional profile:
#   --profile localdb    runs a local Postgres instead of Supabase
# ----------------------------------------------------------------------

services:
  web:
    build:
      context: .
      args:
        INSTALL_PLAYWRIGHT: "0"
        INSTALL_SPACY_MODEL: "0"
    image: civicpulse:web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Live source mount for hot-reload during development.
      - .:/app
      # Persist the HuggingFace cache so the reranker (~1.1 GB) isn't
      # re-downloaded on every container restart.
      - hf_cache:/root/.cache/huggingface
    extra_hosts:
      # Lets the container reach Ollama running on the host.
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    # React 19 + Vite 7 dashboard (frontend-react). Reads Supabase directly
    # (feedbacks / quarters_map views) and calls the FastAPI /api/chat/ +
    # /api/rag/feedback/ endpoints. Auth0 + Supabase keys come from
    # frontend-react/.env (VITE_* vars).
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    image: civicpulse:frontend
    container_name: civicpulse-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_DJANGO_URL: "${VITE_DJANGO_URL:-http://localhost:8000}"
    depends_on:
      - web
    restart: unless-stopped

  postgres:
    # Local Postgres alternative to Supabase. Enable with:
    #   docker compose --profile localdb up postgres web
    # Set DB_HOST=postgres / DB_USER=civicpulse / DB_PASSWORD=civicpulse in .env,
    # then `alembic upgrade head` builds the schema from the baseline migration.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: civicpulse
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles: ["localdb"]

volumes:
  postgres_data:
  hf_cache:
